name: Build deb + publish apt repo

# Builds the welland dnsmasq deb (stock dnsmasq + streaming-AXFR patch) from this
# build branch: pristine upstream source (master) + the dnsmasq-debian/mithro/welland
# packaging delivered via the self-referencing submodule. dnsmasq-base is
# Architecture: any, so this MUST build on arm64 to install on ten64 (Ten64 router).
#
# One build per Debian suite, each in that suite's own container: the ten64s
# track sid, and a package built on sid doesn't install on trixie. A pull
# request builds every suite and publishes nothing.

on:
  push:
    branches: [mithro/welland]
  pull_request:
    branches: [mithro/welland]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    # arm64 runner (free for public repos) -> arm64 debs for ten64
    runs-on: ubuntu-24.04-arm
    name: build-deb (${{ matrix.suite }} arm64)
    strategy:
      fail-fast: false
      matrix:
        suite: [trixie, forky, sid]
    container: debian:${{ matrix.suite }}
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates git dpkg-dev debhelper quilt \
            dh-exec gettext dh-runit pkgconf \
            libnetfilter-conntrack-dev libidn2-dev libdbus-1-dev libgmp-dev \
            nettle-dev liblua5.4-dev libnftables-dev

      - uses: actions/checkout@v4
        with:
          # A pull request builds its own merge commit; everything else
          # builds the build branch.
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'mithro/welland' }}
          submodules: recursive
          fetch-depth: 0

      - name: Trust repo directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Show what we are building
        run: |
          echo "source HEAD: $(git rev-parse --short HEAD)"
          echo "packaging:   $(readlink debian) -> $(git -C submodules/dnsmasq-debian rev-parse --short HEAD)"
          echo "version:     $(dpkg-parsechangelog -S Version)"
          cat debian/patches/series

      - name: Build package (binary-only, arm64)
        run: dpkg-buildpackage -b -us -uc

      - name: Collect debs
        run: |
          mkdir -p built-debs
          cp ../*.deb built-debs/
          ls -l built-debs/

      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.suite }}-arm64
          path: built-debs/
          if-no-files-found: error

  publish-apt:
    # Index, sign and deploy through the shared workflow: one flat repository
    # per suite (<site>/trixie/, <site>/forky/, <site>/sid/), key dnsmasq.gpg,
    # Origin dnsmasq -- the convention every apt repository follows
    # (docs/conventions.md in mithro/apt-repo-action).
    needs: build-deb
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: mithro/apt-repo-action/.github/workflows/publish-apt.yml@main
    with:
      suites: "trixie forky sid"
      architectures: "arm64 all"
      description: "dnsmasq + welland patches (streaming AXFR for large zones)"
    secrets:
      gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
