# How this repository is packaged, and why it differs from the defaults.
# See https://github.com/mithro/apt-repo-action/blob/main/docs/packaging.md

kind = "A"                  # someone else's code: upstream + our patches on `packaging`
upstream = "git://thekelleys.org.uk/dnsmasq.git"
architectures = "any"       # the default set
suites = ["trixie", "forky", "sid"]

[exceptions]
PKG-SUITES = "no raspbian-trixie or raspbian-forky: apt-repo-action's build-deb can only build in debian:<suite> images, and has no Raspbian root file system yet (its compliance-plan.md, section 3.2). 64-bit Raspberry Pi OS uses the Debian arm64 builds."
PKG-SHARED = "packaging/deb-version.py: the shared scripts/deb-version.py has no Set A form yet (compliance-plan.md, section 3.1). Delete it when the shared one does."
